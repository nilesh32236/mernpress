name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify foundation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: mernpress
          POSTGRES_PASSWORD: mernpress
          POSTGRES_DB: mernpress_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mernpress -d mernpress_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://mernpress:mernpress@127.0.0.1:5432/mernpress_test
      TEST_DATABASE_URL: postgresql://mernpress:mernpress@127.0.0.1:5432/mernpress_test
      AUTH_HASH_PEPPER: ci-test-auth-hash-pepper-2026-10-25-0123456789
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Apply migrations to a fresh database
        run: pnpm db:migrate

      - name: Run the idempotent seed no-op
        run: pnpm db:seed

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Dependency audit
        run: pnpm audit --audit-level=high
